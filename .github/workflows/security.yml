name: Security
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade audited build tooling
        run: python -m pip install --upgrade "setuptools>=83" pip-audit
      - name: Install project
        run: pip install .
      - name: Audit installed environment
        run: pip-audit
