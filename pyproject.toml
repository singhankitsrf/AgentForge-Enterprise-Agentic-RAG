[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentforge-enterprise"
version = "0.1.0"
description = "Governed agentic RAG and tool-use reference platform with LangGraph, LangChain and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ankit Kumar Singh"}]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "mcp>=2,<3",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
